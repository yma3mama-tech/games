<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eaf4fa">
<title>棒人間の、ちょっとだけ冒険</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: #e6eef3;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: #22315c; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---- 上部ステータス ---- */
  #top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 10px) 14px 0;
    display: flex; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .chip {
    background: rgba(255,255,255,.72); border: 2px solid currentColor;
    border-radius: 14px 16px 13px 15px; padding: 5px 11px;
    font-size: 13px; font-weight: 700; letter-spacing: .02em;
    line-height: 1.3; backdrop-filter: blur(2px);
  }
  #mood .em { font-size: 17px; vertical-align: -2px; }
  #sub { font-size: 11px; opacity: .8; font-weight: 600; }
  #topright { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
  .iconbtn {
    width: 42px; height: 42px; border-radius: 15px 13px 16px 14px;
    background: rgba(255,255,255,.72); border: 2px solid currentColor;
    color: inherit; font-size: 17px; display: grid; place-items: center;
    cursor: pointer; font-family: inherit;
  }
  .iconbtn:active { transform: scale(.94); }

  /* ---- 下部そうさ ---- */
  #pad {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; align-items: flex-end; justify-content: space-between;
    pointer-events: none;
  }
  #left, #right { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  #right { flex-direction: column; align-items: flex-end; }
  .btn {
    background: rgba(255,255,255,.78); border: 2.5px solid currentColor; color: inherit;
    font-family: inherit; font-weight: 700; cursor: pointer;
    display: grid; place-items: center; backdrop-filter: blur(2px);
  }
  .round { width: 66px; height: 66px; border-radius: 34px 31px 35px 32px; font-size: 26px; }
  #jump { width: 84px; height: 66px; border-radius: 32px 35px 31px 34px; font-size: 16px; }
  #act {
    min-width: 84px; height: 46px; padding: 0 16px; font-size: 15px;
    border-radius: 24px 26px 23px 25px;
    opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s;
    pointer-events: none;
  }
  #act.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .btn:active { transform: scale(.94); }

  /* ---- 実績トースト ---- */
  #toast {
    position: absolute; left: 50%; top: 22%; transform: translate(-50%, -8px);
    background: rgba(255,255,255,.94); border: 2.5px solid #22315c; color: #22315c;
    border-radius: 18px 20px 17px 19px; padding: 11px 18px; text-align: center;
    opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none;
    max-width: 90%; min-width: 200px;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast .t { font-size: 10.5px; letter-spacing: .18em; opacity: .65; font-weight: 700; }
  #toast .n { font-size: 15px; font-weight: 700; margin-top: 3px; }

  /* ---- パネル ---- */
  .panel {
    position: absolute; inset: 0; background: rgba(233,241,246,.985); backdrop-filter: blur(3px);
    display: none; flex-direction: column; z-index: 20;
    padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
  }
  .panel.on { display: flex; }
  .panel h2 { font-size: 18px; margin-bottom: 3px; }
  .panel .lead { font-size: 12px; opacity: .7; margin-bottom: 14px; line-height: 1.6; }
  #achList, #diList { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .ach {
    display: flex; gap: 10px; align-items: baseline;
    border-bottom: 1.5px dashed rgba(34,49,92,.28); padding: 11px 2px;
  }
  .ach .mk { font-size: 15px; width: 20px; flex: none; }
  .ach .nm { font-size: 14.5px; font-weight: 700; line-height: 1.45; }
  .ach .hi { font-size: 11.5px; opacity: .6; margin-top: 2px; }
  .ach.lock .nm { opacity: .38; font-weight: 600; }

  /* ---- 日記 ---- */
  .di { border-bottom: 1.5px dashed rgba(34,49,92,.28); padding: 12px 2px; }
  .di .hd { font-size: 11.5px; opacity: .62; font-weight: 700; letter-spacing: .04em; }
  .di .tx { font-size: 14px; line-height: 1.75; margin-top: 3px; }
  .di .wx { margin-left: 6px; }
  #diList .none { font-size: 13px; opacity: .55; padding: 20px 2px; line-height: 1.9; }
  body.night .di { border-bottom-color: rgba(238,241,251,.25); }
  .closebar { display: flex; justify-content: center; padding-top: 14px; }
  .wide {
    padding: 11px 30px; font-size: 15px; border-radius: 22px 24px 21px 23px;
    background: rgba(255,255,255,.8); border: 2.5px solid currentColor; color: inherit;
    font-family: inherit; font-weight: 700; cursor: pointer;
  }

  /* ---- タイトル ---- */
  #title {
    position: absolute; inset: 0; z-index: 30; background: #eef4f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; text-align: center; padding: 24px;
  }
  #title.off { display: none; }
  #title canvas { width: 150px; height: 150px; }
  #title h1 { font-size: 21px; letter-spacing: .04em; line-height: 1.5; font-weight: 700; }
  #title .sub2 { font-size: 12px; opacity: .65; margin-top: 6px; line-height: 1.8; }
  #title button { margin-top: 26px; }
  #title .foot { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 18px); font-size: 11px; opacity: .5; }

  /* ---- 夜モード（文字色反転） ---- */
  body.night { color: #eef1fb; }
  body.night .chip, body.night .btn, body.night .iconbtn { background: rgba(40,46,80,.62); }
  body.night .panel { background: rgba(36,42,72,.985); }
  body.night .ach { border-bottom-color: rgba(238,241,251,.25); }
  body.night .wide { background: rgba(40,46,80,.7); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="top">
    <div>
      <div class="chip" id="mood">きょうのきぶん：<span class="em">🙂</span></div>
      <div class="chip" id="sub" style="margin-top:6px">1日目</div>
    </div>
    <div id="topright">
      <button class="iconbtn" id="btnDi" aria-label="日記">📖</button>
      <button class="iconbtn" id="btnAch" aria-label="実績">🏆</button>
    </div>
  </div>

  <div id="pad">
    <div id="left">
      <button class="btn round" id="bl" aria-label="ひだり">←</button>
      <button class="btn round" id="br" aria-label="みぎ">→</button>
    </div>
    <div id="right">
      <button class="btn" id="act"></button>
      <button class="btn" id="jump">ジャンプ</button>
    </div>
  </div>

  <div id="toast"><div class="t">じっせき かいほう</div><div class="n"></div></div>

  <div class="panel" id="achPanel">
    <h2>じっせき</h2>
    <div class="lead" id="achLead"></div>
    <div id="achList"></div>
    <div class="closebar"><button class="wide" id="achClose">とじる</button></div>
  </div>

  <div class="panel" id="diPanel">
    <h2>にっき</h2>
    <div class="lead" id="diLead"></div>
    <div id="diList"></div>
    <div class="closebar"><button class="wide" id="diClose">とじる</button></div>
  </div>

  <div id="title">
    <canvas id="tcv" width="300" height="300"></canvas>
    <h1>棒人間の、<br>ちょっとだけ冒険</h1>
    <div class="sub2">敵はいません。ゲームオーバーもありません。<br>目的は、なんとなく毎日を過ごすことです。</div>
    <button class="wide" id="start">そとに出る</button>
    <div class="foot" id="titleFoot"></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   棒人間の、ちょっとだけ冒険
   - 世界はぐるっと一周してつながっている
   - 敵なし・ゲームオーバーなし・急ぐ理由なし
   ========================================================= */

const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
let SW = 0, SH = 0, DPR = 1, groundY = 0, S = 1;

const WORLD = 3000;          // 世界一周のながさ
const DAY_LEN = 600;         // 1日 = 600秒
const WALK = 96;             // 歩くはやさ(px/s)
const GRAV = 1500, JUMPV = 470;

/* ---------- 保存 ---------- */
const SAVE_KEY = 'bojin-adventure-v1';
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; }
  catch (e) { return {}; }   // localStorage が使えない環境でも遊べるように
}
const save = Object.assign({
  day: 1, jumps: 0, laps: 0, achs: [], bridge: false,
  chest: false, sign: 0, birdTalks: 0, rockPush: 0, totalPlay: 0,
  wx: '', quirk: '', wxSeen: [], quirkSeen: 0, diary: [],
  lastDate: '', streak: 0
}, loadSave());
if (!Array.isArray(save.wxSeen)) save.wxSeen = [];
if (!Array.isArray(save.diary)) save.diary = [];
const unlocked = new Set(save.achs);
let saveTimer = 0;
function persist() {
  save.achs = [...unlocked];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

/* ---------- 実績 ---------- */
const ACHS = [
  { id: 'home',     n: '帰ってきた',              h: '夜、家に入る' },
  { id: 'sign',     n: '看板を読んだ',            h: '看板の前で' },
  { id: 'rock',     n: '石は動かなかった',        h: '大きい石を10回おす' },
  { id: 'splash',   n: '川に落ちた',              h: '川のところで' },
  { id: 'bridge',   n: '最初から橋があった',      h: '川のむこうから、だれか来る' },
  { id: 'chest',    n: 'なにも入っていなかった',  h: '宝箱をあける' },
  { id: 'cat',      n: '猫についていった',        h: '猫が歩きだしたら、そのまま' },
  { id: 'bird',     n: '鳥の話を20回きいた',      h: '鳥は、よく話す' },
  { id: 'hole3',    n: '穴を3分見つめた',        h: '穴の前で、じっと' },
  { id: 'jump100',  n: 'そんなに跳ぶ？',          h: '100回とぶ' },
  { id: 'jump1000', n: '……。',                   h: '1000回とぶ' },
  { id: 'lap20',    n: '同じ場所を20周した',      h: 'ぐるぐるする' },
  { id: 'rain',     n: '雨なのに傘を探さなかった', h: '雨の日、そのまま外にいる' },
  { id: 'nothing',  n: '何もしなかった',          h: '2分ほど、何もしない' },
  { id: 'dayend',   n: 'なぜか一日が終わった',    h: '夜になる' },
  { id: 'sleep',    n: 'ゲームを起動したまま寝た', h: '……30分' },
  // ── ここから、ゆっくりたまるもの ──
  { id: 'streak7',  n: '7日つづけて外に出た',      h: '7日、日をまたいで起動する' },
  { id: 'day30',    n: '30日目',                  h: 'そんなに続くとは' },
  { id: 'play1h',   n: '合計1時間、そとにいた',    h: 'いつのまにか' },
  { id: 'snowday',  n: '雪の日も、そとに出た',     h: '雪の日に、しばらく歩く' },
  { id: 'fogday',   n: 'なにも見えなかった',       h: '霧の日に、しばらく歩く' },
  { id: 'allwx',    n: '天気をぜんぶ見た',         h: '天気は6とおり' },
  { id: 'quirk10',  n: 'どうでもいいことに10回気づいた', h: '毎日、ひとつだけある' },
  { id: 'diary10',  n: '日記が10日ぶんたまった',   h: '寝ると、1行のこる' },
];

/* ---------- きょうの天気 ---------- */
const WEATHERS = [
  { id: 'usual', n: 'ふつう',     w: 30, line: '' },
  { id: 'rain',  n: 'あめ',       w: 20, line: 'なんだか、降りそう。' },
  { id: 'fog',   n: 'きり',       w: 14, line: '……なにも見えない。' },
  { id: 'snow',  n: 'ゆき',       w: 10, line: 'ゆきだ。' },
  { id: 'wind',  n: 'かぜ',       w: 14, line: '風が、つよい。' },
  { id: 'fine',  n: 'やたら晴れ', w: 12, line: 'やたら晴れている。' },
];
function wxOf(id) { return WEATHERS.find(w => w.id === id) || WEATHERS[0]; }
function rollWeather() {
  let tot = 0; for (const w of WEATHERS) tot += w.w;
  let r = Math.random() * tot;
  for (const w of WEATHERS) { r -= w.w; if (r <= 0) return w.id; }
  return 'usual';
}

/* ---------- きょうの、どうでもいいこと ----------
   毎朝ひとつだけ世界に置かれ、翌朝には元にもどる。 */
const QUIRKS = [
  { id: 'snail',  n: '石の上に、カタツムリがいた' },
  { id: 'sign',   n: '看板が、倒れていた' },
  { id: 'leaf',   n: '宝箱に、葉っぱが1枚だけ入っていた' },
  { id: 'cat2',   n: '猫が、2匹いた' },
  { id: 'bird',   n: '鳥が、寝ていた' },
  { id: 'river',  n: '川の水が、すこし多かった' },
  { id: 'moon',   n: '昼なのに、月が出ていた' },
  { id: 'flower', n: '家の前に、花が咲いていた' },
];
function qIs(id) { return save.quirk === id; }
function noticeQuirk() {
  if (st.quirkNoticed) return;
  st.quirkNoticed = true;
  save.quirkSeen++; persistSoon();
  if (save.quirkSeen >= 10) unlock('quirk10');
}

/* あたらしい日を用意する（天気とどうでもいいことを引き直す） */
function rollNewDay() {
  // きのうと同じでは「きょうだけ」にならないので、1回だけ引き直す
  const pw = save.wx, pq = save.quirk;
  save.wx = rollWeather();
  if (save.wx === pw) save.wx = rollWeather();
  save.quirk = QUIRKS[Math.floor(Math.random() * QUIRKS.length)].id;
  if (save.quirk === pq) {
    const others = QUIRKS.filter(q => q.id !== pq);
    save.quirk = others[Math.floor(Math.random() * others.length)].id;
  }
  if (save.wxSeen.indexOf(save.wx) < 0) save.wxSeen.push(save.wx);
  if (save.wxSeen.length >= WEATHERS.length) unlock('allwx');
  st.quirkNoticed = false;
  st.fogT = 0; st.snowT = 0; st.flakes = []; st.leaves = [];
  st.dJump = st.dBird = st.dRock = st.dSign = st.dLap = 0;
  st.dWet = st.dUmb = st.dRain = st.dCat = st.dChest = false;
  persist();
}

/* ---------- 状態 ---------- */
const P = {
  x: 190, y: 0, vx: 0, vy: 0, onGround: true, facing: 1,
  walking: false, phase: 0, inWater: false, waterT: 0, indoors: false
};
const st = {
  time: 0, dayTime: 0, idle: 0, started: false,
  mood: '🙂', moodNote: '', jumpBurst: 0, burstT: 0,
  rain: 0, rainNext: 150, umbrella: false, rainSeen: 0,
  holeStare: 0, catFollow: 0, lastIdleLine: 0, fade: 0, fadeDir: 0,
  helper: null, splash: [], drops: [], nightFlag: false,
  exprName: '', exprT: 0, blink: 0, blinkNext: 3,
  // 天気のえんしゅつ
  fog: 0, fogT: 0, snowT: 0, flakes: [], leaves: [], windT: 0,
  // きょうの、どうでもいいこと
  quirkNoticed: false,
  // 日記のための、その日だけのかぞえ
  dJump: 0, dBird: 0, dRock: 0, dSign: 0, dLap: 0,
  dWet: false, dUmb: false, dRain: false, dCat: false, dChest: false
};

/* ---------- 表情のきりかえ ---------- */
function setExpr(name, dur) { st.exprName = name; st.exprT = dur || 2; }
function currentExpr() {
  if (P.inWater) return 'wet';
  if (st.exprT > 0) return st.exprName;      // できごとによる一時的な顔
  if (!P.onGround) return 'oh';              // 跳んでいるあいだ
  if (st.dayP > .88 || st.idle > 60) return 'sleep';
  if (st.rain > 0 && !st.umbrella) return 'tired';
  if (save.jumps >= 1000) return 'blank';
  if (st.jumpBurst >= 12) return 'think';
  if (st.holeStare > 8) return 'wide';
  if (st.catFollow > 3) return 'content';
  if (st.idle > 20) return 'content';
  return 'nose';
}
const cat  = { x: 1720, awake: false, vx: 0, phase: 0 };
const CAT2_X = 1832;   // きょうだけ増える2匹目は、ここで寝つづける（1匹目と重ならない距離）
const bird = { x: 2380, y: 0, following: false, hop: 0, talkT: 4, sitting: true };

/* ---------- 乱数（手描きのゆらぎ） ---------- */
const RT = new Float32Array(4096);
for (let i = 0; i < 4096; i++) RT[i] = Math.random();
let seedFrame = 0, jc = 0;
function jit(a) { jc = (jc + 1) & 4095; return (RT[(jc + seedFrame) & 4095] - 0.5) * a; }
function fixed(i) { return RT[i & 4095]; }

/* ---------- 手描き描画ヘルパ ---------- */
function smoothClosed(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}
function blob(cx, cy, rx, ry, amp, n) {
  n = n || 10;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    pts.push([cx + Math.cos(a) * (rx + jit(amp)), cy + Math.sin(a) * (ry + jit(amp))]);
  }
  smoothClosed(pts);
}
function wline(x1, y1, x2, y2, amp) {
  amp = amp === undefined ? 1.6 : amp;
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2 + jit(amp), (y1 + y2) / 2 + jit(amp), x2, y2);
  ctx.stroke();
}
function tear(x, y, rx, ry, rot) {  // 雫型の手足
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  blob(0, 0, rx, ry, .7, 8);
  ctx.restore();
}
function wrect(x, y, w, h, r) {
  const pts = [];
  const c = [[x + r, y], [x + w - r, y], [x + w, y + r], [x + w, y + h - r],
             [x + w - r, y + h], [x + r, y + h], [x, y + h - r], [x, y + r]];
  for (const p of c) pts.push([p[0] + jit(1.2), p[1] + jit(1.2)]);
  smoothClosed(pts);
}

/* ---------- 色（時間帯） ---------- */
const STOPS = [
  { p: 0.00, sky1: '#ffdcbb', sky2: '#f6f0e4', gr: '#efe6cd', ink: '#22315c', hill: '#dde9dc' },
  { p: 0.16, sky1: '#c2e5f7', sky2: '#eef7fb', gr: '#ede6d0', ink: '#22315c', hill: '#d6e6d8' },
  { p: 0.55, sky1: '#a8daf3', sky2: '#f1f8f4', gr: '#ebe3ca', ink: '#22315c', hill: '#cfe1d2' },
  { p: 0.74, sky1: '#f7bd8b', sky2: '#f9dfc6', gr: '#e0cbaa', ink: '#2a2b4a', hill: '#c8b69d' },
  { p: 0.86, sky1: '#7a72a0', sky2: '#d3a49c', gr: '#a09098', ink: '#2b2b46', hill: '#8b8296' },
  { p: 0.92, sky1: '#48496f', sky2: '#7d6e84', gr: '#6b6880', ink: '#2b2b46', hill: '#5b5a78' },
  { p: 0.96, sky1: '#333a62', sky2: '#4e4f77', gr: '#54587a', ink: '#eef1fb', hill: '#434969' },
  { p: 1.00, sky1: '#2a3157', sky2: '#454a76', gr: '#4a4f6e', ink: '#eef1fb', hill: '#3b4166' },
];
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' + Math.round(A[1] + (B[1] - A[1]) * t) + ',' + Math.round(A[2] + (B[2] - A[2]) * t) + ')';
}
let PAL = {};
function palette(p) {
  let i = 0;
  while (i < STOPS.length - 2 && p > STOPS[i + 1].p) i++;
  const a = STOPS[i], b = STOPS[i + 1];
  const t = Math.max(0, Math.min(1, (p - a.p) / (b.p - a.p)));
  return { sky1: mix(a.sky1, b.sky1, t), sky2: mix(a.sky2, b.sky2, t),
           gr: mix(a.gr, b.gr, t), ink: mix(a.ink, b.ink, t), hill: mix(a.hill, b.hill, t) };
}

/* ---------- 画面サイズ ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = wrap.clientWidth; SH = wrap.clientHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  groundY = Math.round(SH * 0.70);
  S = Math.max(0.72, Math.min(1.3, SH / 760));
}
const wrap = document.getElementById('wrap');
addEventListener('resize', resize);
resize();

/* ---------- ワールド座標 → 画面座標 ---------- */
let camX = 0;
function sx(wx) {
  let d = wx - camX;
  d = ((d % WORLD) + WORLD) % WORLD;
  if (d > WORLD / 2) d -= WORLD;
  return d;
}
function wdist(a, b) {
  let d = a - b;
  d = ((d % WORLD) + WORLD) % WORLD;
  if (d > WORLD / 2) d -= WORLD;
  return d;
}

/* ---------- 棒人間 ---------- */
function drawPerson(x, y, o) {
  o = o || {};
  const sc = (o.scale || 1) * S, f = o.facing || 1;
  const walking = o.walking ? 1 : 0, ph = o.phase || 0, jumping = o.jumping;
  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.lineWidth = 3.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = o.ink || PAL.ink;
  ctx.fillStyle = o.body || PAL.paper || 'rgba(255,255,255,.88)';

  const bob = jumping ? -3 : -Math.abs(Math.sin(ph * 2)) * 1.8 * walking;
  const yb = bob;

  // ---- あし ----
  const swing = Math.sin(ph) * 11 * walking;
  const legs = jumping ? [[-9, -6, .9], [10, 3, -.5]] : [[swing, 0, swing * .04], [-swing, 0, -swing * .04]];
  for (const L of legs) {
    const hx = (L === legs[0] ? -5 : 5), hy = -21 + yb;
    const fx = hx + L[0], fy = -1 + L[1];
    ctx.strokeStyle = o.ink || PAL.ink;
    wline(hx, hy, fx, fy, 1.2);
    ctx.fillStyle = 'rgba(0,0,0,0)';
    tear(fx + f * 3, fy + 1, 6.5, 3.2, f > 0 ? .06 : -.06);
    ctx.stroke();
  }

  // ---- からだ ----
  ctx.fillStyle = o.body || 'rgba(255,255,255,.9)';
  const bt = -53 + yb, bb = -20 + yb;
  smoothClosed([
    [-10 + jit(1), bt + jit(1)], [0 + jit(1), bt - 1 + jit(1)], [10 + jit(1), bt + jit(1)],
    [13 + jit(1), (bt + bb) / 2 + jit(1)], [15 + jit(1), bb + jit(1)],
    [0 + jit(1), bb + 2 + jit(1)], [-15 + jit(1), bb + jit(1)], [-13 + jit(1), (bt + bb) / 2 + jit(1)],
  ]);
  ctx.fill(); ctx.stroke();

  // ---- うで ----
  const aSwing = jumping ? 0 : -Math.sin(ph) * 6 * walking;
  for (const side of [-1, 1]) {
    const shx = side * 9, shy = -48 + yb;
    let hx2, hyy;
    if (o.hold && side === f) {          // かさなどを持っている手は動かさない
      hx2 = o.hold[0]; hyy = o.hold[1] + yb;
    } else if (jumping) {
      hx2 = side * 26; hyy = -58 + yb;
    } else {
      hx2 = side * 20 + (side === 1 ? aSwing : -aSwing) * .5;
      hyy = -25 + yb + (side === 1 ? aSwing : -aSwing) * .35;
    }
    wline(shx, shy, hx2, hyy, 1.2);
    ctx.fillStyle = 'rgba(0,0,0,0)';
    tear(hx2, hyy + 3, 3.2, 5.2, side * .32);
    ctx.stroke();
  }

  // ---- あたま ----
  const hy = -75 + yb;
  ctx.fillStyle = o.body || 'rgba(255,255,255,.92)';
  blob(0, hy, 25, 22, 1.1, 12);
  ctx.fill(); ctx.stroke();

  // ---- かお ----
  drawFace(hy, f, o.expr || 'nose', o.blink, o.ink || PAL.ink);
  ctx.restore();
}

/* 表情。[目, 口] の組み合わせでつくる */
const FACES = {
  nose:    ['dots',   'nose'],   // ふつう
  smile:   ['dots',   'smile'],  // わらう
  content: ['happy',  'smile'],  // ごきげん
  oh:      ['wide',   'oh'],     // おどろく
  wide:    ['wide',   'nose'],   // まじまじ見る
  think:   ['look',   'wavy'],   // かんがえる
  blank:   ['dots',   'flat'],   // むひょうじょう
  tired:   ['half',   'flat'],   // ぐったり
  wet:     ['dots',   'frown'],  // ぬれた
  effort:  ['closed', 'flat'],   // ふんばる
  sleep:   ['closed', 'small'],  // ねむい
};
function drawFace(hy, f, expr, blinking, ink) {
  const F = FACES[expr] || FACES.nose;
  let eyes = F[0]; const mouth = F[1];
  // まばたきは、目をあけている表情のときだけ
  if (blinking && (eyes === 'dots' || eyes === 'wide' || eyes === 'look')) eyes = 'closed';
  ctx.fillStyle = ink; ctx.strokeStyle = ink;
  const ex = f * 2, PI = Math.PI;
  const dot = (dx, dy, r) => { ctx.beginPath(); ctx.ellipse(dx, dy, r, r * 1.15, 0, 0, 6.3); ctx.fill(); };

  // ---- め ----
  for (const side of [-1, 1]) {
    const x = side * 8 + ex;
    if (eyes === 'dots') dot(x, hy - 5, 2.4);
    else if (eyes === 'wide') dot(x, hy - 5, 3.5);
    else if (eyes === 'look') dot(x + f * 2, hy - 8, 2.4);
    else if (eyes === 'closed') {
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(x, hy - 3, 4.5, 0.15 * PI, 0.85 * PI); ctx.stroke();
    } else if (eyes === 'happy') {
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(x, hy - 2, 4.5, 1.14 * PI, 1.86 * PI); ctx.stroke();
    } else if (eyes === 'half') {
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x - 4.6, hy - 8); ctx.lineTo(x + 4.6, hy - 8); ctx.stroke();
      dot(x, hy - 4, 2);
    }
  }

  // ---- くち ----
  ctx.lineWidth = 2.6;
  if (mouth === 'nose') { ctx.beginPath(); ctx.ellipse(f * 3, hy + 4, 3.2, 4.2, 0, 0, 6.3); ctx.fill(); }
  else if (mouth === 'small') { ctx.beginPath(); ctx.ellipse(f * 3, hy + 5, 2.6, 3.4, 0, 0, 6.3); ctx.fill(); }
  else if (mouth === 'oh') { ctx.beginPath(); ctx.ellipse(1 + ex, hy + 5, 4.5, 5.5, 0, 0, 6.3); ctx.fill(); }
  else if (mouth === 'smile') { ctx.beginPath(); ctx.arc(ex, hy + 3, 6, 0.16 * PI, 0.84 * PI); ctx.stroke(); }
  else if (mouth === 'frown') { ctx.beginPath(); ctx.arc(ex, hy + 11, 6, 1.18 * PI, 1.82 * PI); ctx.stroke(); }
  else if (mouth === 'flat') {
    ctx.beginPath(); ctx.moveTo(ex - 5, hy + 5); ctx.lineTo(ex + 5, hy + 5); ctx.stroke();
  } else if (mouth === 'wavy') {
    ctx.beginPath(); ctx.moveTo(ex - 6, hy + 6);
    ctx.quadraticCurveTo(ex - 3, hy + 2, ex, hy + 5);
    ctx.quadraticCurveTo(ex + 3, hy + 8, ex + 6, hy + 4);
    ctx.stroke();
  }
}

/* ---------- ふきだし ---------- */
let bubble = null;   // {text, t, life, who}
function speak(text, life) {
  bubble = { text: text, t: 0, life: life || 2.8 };
}
function drawBubble(px, py, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '600 ' + Math.round(14 * S) + 'px ' + getComputedStyle(document.body).fontFamily;
  ctx.textBaseline = 'middle';
  const maxW = Math.min(SW - 40, 230 * S);
  const lines = []; let cur = '';
  for (const ch of text) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  lines.push(cur);
  let w = 0; for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
  const lh = 20 * S, padx = 13 * S, pady = 10 * S;
  const bw = w + padx * 2, bh = lines.length * lh + pady * 2 - 4 * S;
  let bx = px - bw / 2;
  bx = Math.max(10, Math.min(SW - bw - 10, bx));
  const by = py - bh;
  ctx.lineWidth = 2.6; ctx.strokeStyle = PAL.ink;
  ctx.fillStyle = PAL.bubble;
  wrect(bx, by, bw, bh, 12 * S); ctx.fill(); ctx.stroke();
  // しっぽ
  ctx.beginPath();
  ctx.moveTo(px - 6 * S, by + bh - 1);
  ctx.quadraticCurveTo(px, by + bh + 11 * S, px + 6 * S, by + bh - 1);
  ctx.fillStyle = PAL.bubble; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(px - 6 * S, by + bh - 1);
  ctx.quadraticCurveTo(px, by + bh + 11 * S, px + 6 * S, by + bh - 1);
  ctx.stroke();
  ctx.fillStyle = PAL.ink; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + pady + lh * i + lh / 2 - 2 * S));
  ctx.restore();
}

/* ---------- 風景パーツ ---------- */
function drawHouse(x) {
  const g = groundY, s = S;
  ctx.lineWidth = 3.2; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  const w = 104 * s, h = 72 * s;
  wrect(x - w / 2, g - h, w, h, 4); ctx.fill(); ctx.stroke();
  // やね
  ctx.beginPath();
  ctx.moveTo(x - w / 2 - 12 * s + jit(1), g - h + 2 * s + jit(1));
  ctx.lineTo(x - 2 * s + jit(1.5), g - h - 40 * s + jit(1.5));
  ctx.lineTo(x + w / 2 + 12 * s + jit(1), g - h + 2 * s + jit(1));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // ドア（夜はあかりがつく）
  const lit = st.dayP > .78;
  ctx.fillStyle = lit ? PAL.warm : PAL.bubble;
  wrect(x - 32 * s, g - 42 * s, 30 * s, 42 * s, 13 * s); ctx.fill(); ctx.stroke();
  // まど
  ctx.fillStyle = lit ? PAL.warm : PAL.bubble;
  wrect(x + 8 * s, g - 50 * s, 30 * s, 26 * s, 5 * s); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2.2;
  wline(x + 23 * s, g - 50 * s, x + 23 * s, g - 24 * s, .8);
  // きょうだけの花
  if (qIs('flower')) for (let i = 0; i < 3; i++) drawFlower(x + (i - 1) * 22 * s + 58 * s, i);
}
/* きょうだけの、ちいさな花 */
function drawFlower(x, k) {
  const g = groundY, s = S;
  const h = (14 + fixed(k * 37) * 6) * s;
  ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink;
  ctx.beginPath(); ctx.moveTo(x, g);
  ctx.quadraticCurveTo(x + 2 * s, g - h * .6, x, g - h); ctx.stroke();
  ctx.fillStyle = st.dayP > .93 ? 'rgba(206,186,214,.9)' : 'rgba(250,214,224,.95)';
  ctx.lineWidth = 1.8;
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(a) * 3.6 * s, g - h + Math.sin(a) * 3.6 * s, 3 * s, 3 * s, 0, 0, 6.3);
    ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(x, g - h, 1.6 * s, 0, 6.3); ctx.fill();
}
/* きょうだけの、カタツムリ */
function drawSnail(x, y) {
  const s = S;
  ctx.lineWidth = 2.2; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  blob(x, y, 9 * s, 8 * s, .8, 9); ctx.fill(); ctx.stroke();   // から
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= 22; i++) {
    const a = i / 22 * Math.PI * 3.2, r = (1 - i / 26) * 7 * s;
    const X2 = x + Math.cos(a) * r, Y2 = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(X2, Y2); else ctx.lineTo(X2, Y2);
  }
  ctx.stroke();
  ctx.lineWidth = 2.2; ctx.fillStyle = PAL.bubble;
  blob(x - 11 * s, y + 5 * s, 6 * s, 3.6 * s, .5, 8); ctx.fill(); ctx.stroke();  // からだ
  ctx.lineWidth = 1.6;
  const tw = Math.sin(st.time * 1.6) * 1.2 * s;
  wline(x - 14 * s, y + 3 * s, x - 17 * s + tw, y - 4 * s, .4);
  wline(x - 10 * s, y + 2 * s, x - 12 * s + tw, y - 5 * s, .4);
}
function drawRock(x) {
  const g = groundY, s = S;
  ctx.lineWidth = 3.2; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  const pts = [];
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = Math.PI + i / (n - 1) * Math.PI;
    const rr = 1 + fixed(i * 7) * .22;
    pts.push([x + Math.cos(a) * 52 * s * rr + jit(1.4), g + Math.sin(a) * 46 * s * rr + jit(1.4)]);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], g);
  for (let i = 0; i < n - 1; i++) {
    const p = pts[i], q = pts[i + 1];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.lineTo(pts[n - 1][0], g);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2;
  wline(x - 14 * s, g - 30 * s, x - 2 * s, g - 12 * s, 1.4);
  // きょうだけのカタツムリ（石のてっぺん）
  if (qIs('snail')) drawSnail(x + 6 * s, g - 44 * s);
}
function drawSign(x) {
  const g = groundY, s = S;
  const down = qIs('sign');
  ctx.save();
  // きょうだけ、看板は倒れている
  if (down) { ctx.translate(x, g); ctx.rotate(-1.32); ctx.translate(-x, -g); }
  ctx.lineWidth = 3.2; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  wline(x, g, x, g - 52 * s, 1);
  wrect(x - 30 * s, g - 84 * s, 60 * s, 36 * s, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(20 * s) + 'px sans-serif';
  ctx.fillText('？', x, g - 65 * s);
  ctx.restore();
}
function drawChest(x) {
  const g = groundY, s = S;
  ctx.lineWidth = 3.2; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  wrect(x - 28 * s, g - 34 * s, 56 * s, 34 * s, 4); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2.2;
  wline(x - 28 * s, g - 20 * s, x + 28 * s, g - 20 * s, .8);   // 帯
  ctx.lineWidth = 3.2;
  ctx.save();
  ctx.translate(x - 28 * s, g - 34 * s);
  if (save.chest) ctx.rotate(-1.2);
  ctx.beginPath();
  ctx.moveTo(0 + jit(1), 0 + jit(1));
  ctx.quadraticCurveTo(28 * s, -22 * s, 56 * s + jit(1), 0 + jit(1));
  ctx.lineTo(56 * s, 2 * s); ctx.lineTo(0, 2 * s); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.ellipse(x, g - 14 * s, 2.6 * s, 3.2 * s, 0, 0, 6.3); ctx.fill();
  // きょうだけの葉っぱ（1枚だけ、ふちからのぞいている）
  if (qIs('leaf')) {
    ctx.save();
    ctx.translate(x + 8 * s, g - 36 * s); ctx.rotate(-.35);
    ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink;
    ctx.fillStyle = st.dayP > .93 ? 'rgba(126,150,132,.9)' : 'rgba(186,214,178,.95)';
    ctx.beginPath(); ctx.ellipse(0, 0, 11 * s, 5 * s, 0, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-10 * s, 0); ctx.lineTo(10 * s, 0); ctx.stroke();
    ctx.restore();
  }
}
function drawTree(x, k) {
  const g = groundY, s = S;
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  const h = (60 + fixed(k * 13) * 26) * s;
  wline(x, g, x + jit(1), g - h, 1);
  blob(x, g - h - 22 * s, (28 + fixed(k * 3) * 8) * s, 24 * s, 2.4, 11);
  ctx.fill(); ctx.stroke();
}
function drawGrass(x, k) {
  const g = groundY, s = S;
  ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink; ctx.globalAlpha = .55;
  const n = fixed(k * 5) > .5 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const dx = (i - .5) * 6 * s, dir = i ? 1 : -1;
    const h = (7 + fixed(k * 11 + i) * 4) * s;
    ctx.beginPath(); ctx.moveTo(x + dx, g);
    ctx.quadraticCurveTo(x + dx + dir * 2 * s, g - h, x + dx + dir * 5 * s, g - h - 2 * s);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
/* ねている猫（きょうだけ2匹になることがあるので、切り出してある） */
function drawSleepingCat(x, sc) {
  const g = groundY, s = S * (sc || 1);
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  blob(x, g - 12 * s, 30 * s, 12 * s, 1.4, 10); ctx.fill(); ctx.stroke();     // からだ
  blob(x - 30 * s, g - 17 * s, 14 * s, 12 * s, 1.2, 9); ctx.fill(); ctx.stroke(); // あたま
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(x - 34 * s, g - 19 * s, 3.4 * s, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 25 * s, g - 19 * s, 3.4 * s, .1 * Math.PI, .9 * Math.PI); ctx.stroke();
  // みみ
  ctx.lineWidth = 3;
  wline(x - 38 * s, g - 25 * s, x - 34 * s, g - 32 * s, .6); wline(x - 34 * s, g - 32 * s, x - 30 * s, g - 25 * s, .6);
  wline(x - 26 * s, g - 26 * s, x - 22 * s, g - 32 * s, .6); wline(x - 22 * s, g - 32 * s, x - 19 * s, g - 26 * s, .6);
  // しっぽ

  ctx.quadraticCurveTo(x + 48 * s, g - 16 * s, x + 42 * s, g - 30 * s); ctx.stroke();
  // Zzz

  ctx.font = '700 ' + Math.round(13 * s) + 'px sans-serif';
  const zz = Math.sin(st.time * 1.3) * 3 * s;
  ctx.fillText('z', x + 16 * s, g - 34 * s + zz);
  ctx.fillText('z', x + 26 * s, g - 46 * s + zz * .6);
}
function drawCat() {
  // きょうだけ、もう1匹ねている（1匹目が起きて歩きだしても、こちらは寝たまま）
  if (qIs('cat2')) {
    const x2 = sx(CAT2_X);
    if (x2 > -140 && x2 < SW + 140) drawSleepingCat(x2, .88);
  }
  const x = sx(cat.x), g = groundY, s = S;
  if (x < -140 || x > SW + 140) return;
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  if (!cat.awake) {

    ctx.save(); ctx.translate(x, 0); ctx.scale(f, 1);

    blob(22 * s, g - 28 * s, 13 * s, 12 * s, 1.2, 9); ctx.fill(); ctx.stroke();

    ctx.fillStyle = PAL.bubble;

    wline(28 * s, g - 36 * s, 31 * s, g - 43 * s, .6); wline(31 * s, g - 43 * s, 34 * s, g - 36 * s, .6);

    wline(-12 * s, g - 10 * s, -12 * s + lp, g, 1); wline(10 * s, g - 10 * s, 10 * s - lp, g, 1);
    ctx.beginPath(); ctx.moveTo(-22 * s, g - 22 * s);
    ctx.quadraticCurveTo(-38 * s, g - 26 * s, -34 * s, g - 40 * s); ctx.stroke();
    ctx.restore();

}

    return;
  }
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.ellipse(x + 5 * s, y - 17 * s, 1.9 * s, 2.2 * s, 0, 0, 6.3); ctx.fill();
  ctx.beginPath();  // くちばし
  ctx.moveTo(x + 13 * s, y - 16 * s); ctx.lineTo(x + 22 * s, y - 14 * s); ctx.lineTo(x + 13 * s, y - 11 * s);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.2;
  wline(x - 3 * s, y - 2 * s, x - 3 * s, y, .5); wline(x + 4 * s, y - 2 * s, x + 4 * s, y, .5);
  // つばさ
  ctx.lineWidth = 2.4; ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.beginPath(); ctx.moveTo(x - 4 * s, y - 17 * s);
  ctx.quadraticCurveTo(x - 12 * s, y - 12 * s, x - 3 * s, y - 8 * s); ctx.stroke();
}

/* ---------- せかい ---------- */
const RIVER_X = 1250, RIVER_W = 118;
const HOLE_X = 2760, HOLE_W = 74;
const HOUSE_X = 190, ROCK_X = 560, SIGN_X = 900, CHEST_X = 1950;

function drawWorld() {
  // ---- そら ----
  const g = ctx.createLinearGradient(0, 0, 0, groundY + 40);
  g.addColorStop(0, PAL.sky1); g.addColorStop(1, PAL.sky2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, SW, groundY + 40);

  // ---- ほし ----
  const na = Math.max(0, (st.dayP - 0.8) / 0.18);
  if (na > 0.02) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, na) * .9 + ')';
    for (let i = 0; i < 40; i++) {
      const px = (fixed(i * 31) * WORLD - camX * .04);
      const X = ((px % SW) + SW) % SW;
      const Y = fixed(i * 17) * groundY * .6 + 10;
      const tw = .6 + Math.sin(st.time * 1.4 + i) * .4;
      ctx.globalAlpha = Math.min(1, na) * tw;
      ctx.fillRect(X, Y, 2, 2);
    }
    ctx.globalAlpha = 1;
    // つき
    const mx = ((SW * .78 - camX * .02) % SW + SW) % SW;
    ctx.fillStyle = 'rgba(255,252,235,' + Math.min(1, na) + ')';
    ctx.beginPath(); ctx.arc(mx, groundY * .22, 17 * S, 0, 6.3); ctx.fill();
  }

  // ---- 昼の月（きょうだけ） ----
  if (qIs('moon') && na < .5) {
    const mx2 = ((SW * .70 - camX * .02) % SW + SW) % SW;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.62 - na) + ')';
    ctx.beginPath(); ctx.arc(mx2, groundY * .19, 15 * S, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(120,140,170,' + (0.34 - na * .5) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx2, groundY * .19, 15 * S, 0, 6.3); ctx.stroke();
  }

  // ---- やたら晴れの日の、おひさま ----
  if (save.wx === 'fine' && na < .4) {
    const sxp = ((SW * .82 - camX * .02) % SW + SW) % SW, syp = groundY * .17;
    ctx.strokeStyle = 'rgba(255,206,128,' + (0.66 - na) + ')'; ctx.lineWidth = 2.6;
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2 + st.time * .12;
      const r0 = 22 * S, r1 = (30 + Math.sin(st.time * .9 + i) * 3) * S;
      ctx.beginPath();
      ctx.moveTo(sxp + Math.cos(a) * r0, syp + Math.sin(a) * r0);
      ctx.lineTo(sxp + Math.cos(a) * r1, syp + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,238,196,' + (0.85 - na) + ')';
    ctx.beginPath(); ctx.arc(sxp, syp, 18 * S, 0, 6.3); ctx.fill();
  }

  // ---- くも（天気で数と流れかたが変わる） ----
  const cN = save.wx === 'fine' ? 3 : (save.wx === 'rain' || save.wx === 'snow' ? 9 : 7);
  const cDrift = save.wx === 'wind' ? st.time * 40 : 0;
  ctx.fillStyle = 'rgba(255,255,255,' + (0.72 - na * .5) + ')';
  for (let i = 0; i < cN; i++) {
    const wx = fixed(i * 53) * WORLD;
    let d = ((wx - camX * .18 - cDrift) % WORLD + WORLD) % WORLD;
    if (d > WORLD / 2) d -= WORLD;
    const X = d * (SW / (WORLD * .25)) % (SW + 300) - 100;
    const Y = 40 + fixed(i * 91) * groundY * .34;
    const cs = (0.7 + fixed(i * 7) * .7) * S;
    blob(X, Y, 42 * cs, 17 * cs, 3, 11); ctx.fill();
  }

  // ---- とおい丘 ----
  ctx.fillStyle = PAL.hill;
  ctx.beginPath(); ctx.moveTo(-20, groundY + 6);
  for (let i = 0; i <= 12; i++) {
    const X = -20 + i * (SW + 40) / 12;
    const off = ((camX * .3) / 90 + i);
    const Y = groundY - 26 * S - Math.sin(off * .8) * 26 * S - Math.sin(off * 1.9) * 10 * S;
    ctx.lineTo(X, Y);
  }
  ctx.lineTo(SW + 20, groundY + 6); ctx.closePath(); ctx.fill();

  // ---- じめん ----
  ctx.fillStyle = PAL.gr;
  ctx.fillRect(0, groundY, SW, SH - groundY);
  // 地面のかすかな点々
  ctx.fillStyle = PAL.ink; ctx.globalAlpha = .1;
  for (let i = 0; i < 60; i++) {
    const X = sx(fixed(i * 29 + 3) * WORLD);
    if (X < -6 || X > SW + 6) continue;
    ctx.fillRect(X, groundY + 8 + fixed(i * 13) * (SH - groundY - 14), 3.5, 2);
  }
  ctx.globalAlpha = 1;

  // ---- 川 ----
  const rx = sx(RIVER_X), rw = RIVER_W * S;
  const rdep = 82 * S;
  // きょうだけ、水がすこし多い
  const hi = qIs('river') ? 7 * S : 0;
  if (rx > -rw && rx < SW + rw) {
    ctx.fillStyle = PAL.water;
    ctx.fillRect(rx - rw / 2 - hi, groundY - 2 - hi, rw + hi * 2, rdep + hi);
    ctx.fillStyle = PAL.gr;
    ctx.fillRect(rx - rw / 2, groundY - 2 + rdep, rw, SH);
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, groundY + rdep - 2 + jit(2));
    ctx.quadraticCurveTo(rx, groundY + rdep + 6 * S, rx + rw / 2, groundY + rdep - 2 + jit(2));
    ctx.stroke();
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const wy = groundY + 16 * S + i * 17 * S;
      const ph = st.time * .8 + i;
      ctx.beginPath();
      ctx.moveTo(rx - rw / 2 + 8 * S, wy);
      ctx.quadraticCurveTo(rx + Math.sin(ph) * 10 * S, wy + 5 * S, rx + rw / 2 - 8 * S, wy);
      ctx.stroke();
    }
    if (save.bridge) {
      ctx.fillStyle = PAL.bubble; ctx.lineWidth = 3.2; ctx.strokeStyle = PAL.ink;
      wrect(rx - rw / 2 - 8 * S, groundY - 7 * S, rw + 16 * S, 8 * S, 3); ctx.fill(); ctx.stroke();
      for (let i = 0; i < 4; i++) {
        const bx2 = rx - rw / 2 + rw * (i + .5) / 4;
        ctx.lineWidth = 2.4; wline(bx2, groundY + 1 * S, bx2, groundY + 13 * S, 1);
      }
    }
  }

  // ---- じめんの線（川のところは切る） ----
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.2;
  const gapA = rx - rw / 2, gapB = rx + rw / 2;
  let seg = [[-10, SW + 10]];
  if (gapB > -10 && gapA < SW + 10) seg = [[-10, gapA], [gapB, SW + 10]];
  for (const sgm of seg) {
    if (sgm[1] - sgm[0] < 4) continue;
    ctx.beginPath(); ctx.moveTo(sgm[0], groundY);
    const n = Math.max(2, Math.round((sgm[1] - sgm[0]) / 46));
    for (let i = 1; i <= n; i++) {
      const X = sgm[0] + (sgm[1] - sgm[0]) * i / n;
      const pX = sgm[0] + (sgm[1] - sgm[0]) * (i - .5) / n;
      ctx.quadraticCurveTo(pX, groundY + jit(2.4), X, groundY + jit(1.2));
    }
    ctx.stroke();
  }

  // ---- あな ----
  const hx = sx(HOLE_X);
  if (hx > -100 && hx < SW + 100) {
    ctx.fillStyle = PAL.hole;
    blob(hx, groundY + 3 * S, HOLE_W / 2 * S, 11 * S, 1.4, 12); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke();
  }

  // ---- 木と草 ----
  for (let i = 0; i < 16; i++) {
    const wx = 60 + fixed(i * 41) * WORLD;
    if (Math.abs(wdist(wx, RIVER_X)) < 120 || Math.abs(wdist(wx, HOUSE_X)) < 110) continue;
    const X = sx(wx);
    if (X > -80 && X < SW + 80) drawTree(X, i);
  }
  for (let i = 0; i < 46; i++) {
    const wx = fixed(i * 23 + 5) * WORLD;
    if (Math.abs(wdist(wx, RIVER_X)) < 80) continue;
    const X = sx(wx);
    if (X > -30 && X < SW + 30) drawGrass(X, i);
  }

  // ---- もの ----
  let X;
  X = sx(HOUSE_X); if (X > -140 && X < SW + 140) drawHouse(X);
  X = sx(ROCK_X);  if (X > -140 && X < SW + 140) drawRock(X);
  X = sx(SIGN_X);  if (X > -100 && X < SW + 100) drawSign(X);
  X = sx(CHEST_X); if (X > -100 && X < SW + 100) drawChest(X);
  drawCat();
  drawBird();
}

/* ---------- 雨 ---------- */
function updateRain(dt) {
  if (save.wx !== 'rain') {
    st.rain = 0;
    for (let i = st.drops.length - 1; i >= 0; i--) {
      const d = st.drops[i];
      d.y += d.v * dt; d.x -= 40 * dt;
      if (d.y > SH) st.drops.splice(i, 1);
    }
    return;
  }
  if (st.rain > 0) {
    st.rain -= dt;
    st.rainSeen += dt;
    st.dRain = true;
    if (st.drops.length < 90) {
      for (let i = 0; i < 3; i++)
        st.drops.push({ x: Math.random() * (SW + 120) - 60, y: -20, v: 620 + Math.random() * 260 });
    }
    if (st.rain <= 0) {
      if (!st.umbrella && st.rainSeen > 30) unlock('rain');
      speak('やんだ。', 2.4); setExpr('content', 2.6);
      st.rainNext = 180 + Math.random() * 200;
      st.rainSeen = 0;
    }
  } else {
    st.rainNext -= dt;
    if (st.rainNext <= 0) {
      st.rain = 70 + Math.random() * 40; st.rainSeen = 0;
      speak('あ、雨。', 2.6); setExpr('oh', 1.8);
    }
  }
  for (let i = st.drops.length - 1; i >= 0; i--) {
    const d = st.drops[i];
    d.y += d.v * dt; d.x -= 40 * dt;
    if (d.y > SH) st.drops.splice(i, 1);
  }
}
function drawRain() {
  if (!st.drops.length) return;
  ctx.strokeStyle = 'rgba(140,175,205,.75)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (const d of st.drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + 13); }
  ctx.stroke();
}

/* ---------- 霧・雪・風 ----------
   雨とちがって、その日ずっと続く。急ぐ理由にはならない。 */
function updateSky(dt) {
  // きり（朝がいちばん濃く、昼にすこし晴れ、夕方にまた出る）
  let want = 0;
  if (save.wx === 'fog') {
    want = st.dayP < .30 ? 1
         : st.dayP < .62 ? 1 - (st.dayP - .30) * 1.7
         : .48 + (st.dayP - .62) * .8;
    want = Math.max(.34, Math.min(1, want));
  }
  st.fog += (want - st.fog) * Math.min(1, dt * .4);
  if (st.fog < .003) st.fog = 0;
  if (save.wx === 'fog' && st.fog > .55) {
    st.fogT += dt;
    if (st.fogT > 45) unlock('fogday');
  }

  // ゆき
  if (save.wx === 'snow') {
    st.snowT += dt;
    if (st.snowT > 40) unlock('snowday');
    while (st.flakes.length < 64 && Math.random() < dt * 26) {
      st.flakes.push({
        x: Math.random() * (SW + 80) - 40, y: -12,
        v: 24 + Math.random() * 30, p: Math.random() * 6.3,
        r: 1.5 + Math.random() * 2.2
      });
    }
  }
  for (let i = st.flakes.length - 1; i >= 0; i--) {
    const f = st.flakes[i];
    f.y += f.v * dt; f.p += dt * 1.5; f.x += Math.sin(f.p) * 16 * dt;
    if (f.y > SH + 10) st.flakes.splice(i, 1);
  }

  // かぜ（葉っぱが右から左へ流れていく）
  if (save.wx === 'wind') {
    st.windT += dt;
    while (st.leaves.length < 12 && Math.random() < dt * 2.2) {
      st.leaves.push({
        x: SW + 24, y: 40 + Math.random() * (groundY - 30),
        v: 140 + Math.random() * 180, p: Math.random() * 6.3,
        s: .7 + Math.random() * .7
      });
    }
  }
  for (let i = st.leaves.length - 1; i >= 0; i--) {
    const l = st.leaves[i];
    l.x -= l.v * dt; l.p += dt * 4.6; l.y += Math.sin(l.p) * 30 * dt;
    if (l.x < -34) st.leaves.splice(i, 1);
  }
}
function drawSnow() {
  if (!st.flakes.length) return;
  ctx.fillStyle = st.dayP > .93 ? 'rgba(228,234,252,.9)' : 'rgba(255,255,255,.94)';
  for (const f of st.flakes) {
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r * S, 0, 6.3); ctx.fill();
  }
}
function drawLeaves() {
  if (!st.leaves.length) return;
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4;
  ctx.fillStyle = st.dayP > .93 ? 'rgba(122,128,162,.85)' : 'rgba(206,182,132,.92)';
  for (const l of st.leaves) {
    ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.p);
    ctx.beginPath(); ctx.ellipse(0, 0, 6.5 * l.s * S, 2.6 * l.s * S, 0, 0, 6.3);
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
}
/* 霧のかぶせ。うしろ用（濃い）とてまえ用（うすい）を分けて、奥ゆきを出す */
function drawFog(strength) {
  if (st.fog <= 0) return;
  const a = st.fog * strength;
  ctx.fillStyle = (st.dayP > .93 ? 'rgba(74,82,116,' : 'rgba(228,235,240,') + a + ')';
  ctx.fillRect(0, 0, SW, SH);
}
/* かさ。棒人間のあとに描き、柄が手までつながって見えるようにする。
   頭が大きいので、柄は顔の横（目より外側）を通る位置に寄せてある */
const UMB_HAND = [24, -30];   // かさを持つ手の位置（ローカル座標。xには向きを掛ける）
function drawUmbrella(px, py, f, yb) {
  const X = x => px + x * S, Y = y => py + (y + yb) * S;
  const cx = f * 14, cy = -100;
  ctx.save();
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = PAL.ink; ctx.fillStyle = PAL.bubble;
  // え（手のところまでまっすぐ伸ばす）
  ctx.beginPath();
  ctx.moveTo(X(cx), Y(cy + 4));
  ctx.lineTo(X(f * UMB_HAND[0]), Y(UMB_HAND[1] + 3));
  ctx.stroke();
  // かさの面
  ctx.beginPath();
  ctx.moveTo(X(cx - 35), Y(cy));
  ctx.quadraticCurveTo(X(cx - 26), Y(cy - 30), X(cx), Y(cy - 33));
  ctx.quadraticCurveTo(X(cx + 26), Y(cy - 30), X(cx + 35), Y(cy));
  ctx.quadraticCurveTo(X(cx + 17), Y(cy - 10), X(cx), Y(cy - 2));
  ctx.quadraticCurveTo(X(cx - 17), Y(cy - 10), X(cx - 35), Y(cy));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // ほね
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(cx), Y(cy - 31)); ctx.lineTo(X(cx), Y(cy - 2)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(cx - 19), Y(cy - 23)); ctx.lineTo(X(cx - 16), Y(cy - 6)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(cx + 19), Y(cy - 23)); ctx.lineTo(X(cx + 16), Y(cy - 6)); ctx.stroke();
  ctx.restore();
}

/* ---------- 実績 ---------- */
const toastEl = document.getElementById('toast');
let toastQ = [], toastT = 0;
function unlock(id) {
  if (unlocked.has(id)) return;
  unlocked.add(id); persist();
  const a = ACHS.find(a => a.id === id);
  toastQ.push(a ? a.n : id);
}
function updateToast(dt) {
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) toastEl.classList.remove('on');
  } else if (toastQ.length) {
    toastEl.querySelector('.n').textContent = toastQ.shift();
    toastEl.classList.add('on');
    toastT = 3.0;
  }
}

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ---------- そうさ ---------- */
const keys = { l: false, r: false };
function hold(el, on) {
  const dn = e => { e.preventDefault(); on(true); st.idle = 0; };
  const up = e => { e.preventDefault(); on(false); };
  el.addEventListener('pointerdown', dn);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
hold(document.getElementById('bl'), v => keys.l = v);
hold(document.getElementById('br'), v => keys.r = v);
document.getElementById('jump').addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'ArrowLeft') keys.l = true;
  if (e.key === 'ArrowRight') keys.r = true;
  if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); doJump(); }
  if (e.key === 'Enter') doAction();
  st.idle = 0;
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.l = false;
  if (e.key === 'ArrowRight') keys.r = false;
});

function doJump() {
  st.idle = 0;
  if (P.indoors || P.inWater || !P.onGround) return;
  P.vy = -JUMPV; P.onGround = false;
  save.jumps++; st.dJump++; st.jumpBurst++; st.burstT = 0;
  for (const j of LINES.jump) if (save.jumps === j[0]) { speak(j[1], 3); setExpr('think', 3); }
  if (save.jumps >= 100) unlock('jump100');
  if (save.jumps >= 1000) unlock('jump1000');
  persistSoon();
}
function persistSoon() { saveTimer = 1.5; }

/* ---------- しらべる ---------- */
const actBtn = document.getElementById('act');
let curAct = null;
actBtn.addEventListener('pointerdown', e => { e.preventDefault(); doAction(); });

function nearest() {
  if (P.inWater || P.indoors) return null;
  const cands = [
    { id: 'house', x: HOUSE_X, r: 66,
      label: st.rain > 0 && !st.umbrella ? 'かさをとる' : (st.dayP > .82 ? 'ねる' : 'ながめる') },
    { id: 'rock',  x: ROCK_X,  r: 62, label: 'おす' },
    { id: 'sign',  x: SIGN_X,  r: 52, label: qIs('sign') ? 'おこす' : 'よむ' },
    { id: 'chest', x: CHEST_X, r: 52, label: save.chest ? 'また見る' : 'あける' },
    { id: 'hole',  x: HOLE_X,  r: 56, label: 'のぞく' },
    { id: 'cat',   x: cat.x,   r: 60, label: cat.awake ? 'なでる' : 'おこさない' },
    { id: 'bird',  x: bird.x,  r: 56, label: qIs('bird') ? 'そっとしておく' : 'はなしかける' },
  ];
  if (qIs('cat2')) cands.push({ id: 'cat2', x: CAT2_X, r: 58, label: 'おこさない' });
  let best = null, bd = 1e9;
  for (const c of cands) {
    const d = Math.abs(wdist(c.x, P.x));
    if (d < c.r && d < bd) { bd = d; best = c; }
  }
  return best;
}
function doAction() {
  st.idle = 0;
  if (!curAct) return;
  switch (curAct.id) {
    case 'house':
      if (st.rain > 0 && !st.umbrella) {
        st.umbrella = true; st.dUmb = true; speak('かさ、あった。', 2.6); setExpr('smile', 2.6);
      } else if (st.dayP > .82) goSleep();
      else if (qIs('flower') && !st.quirkNoticed) {
        noticeQuirk();
        speak('花が咲いている。いつから。', 3.2); setExpr('oh', 3);
      } else {
        speak(pick(['ここが家。', 'まだ帰らない。', 'ちょっとそこまで、のつもりだった。']), 2.8);
        setExpr('content', 2.8);
      }
      break;
    case 'rock':
      save.rockPush++; st.dRock++; persistSoon();
      if (qIs('snail') && !st.quirkNoticed) {
        noticeQuirk();
        speak('……カタツムリがいる。おせない。', 3.2); setExpr('oh', 3);
      } else {
        setExpr('effort', 1.9);
        speak(LINES.rock[Math.min(save.rockPush - 1, LINES.rock.length - 1)], 2.6);
      }
      if (save.rockPush >= 10) unlock('rock');
      break;
    case 'sign':
      save.sign++; st.dSign++; unlock('sign'); persistSoon();
      if (qIs('sign')) {
        noticeQuirk();
        speak(pick(['倒れている。', '起こしても、また倒れる。', '（読めない）', 'きょうは、休みらしい。']), 3);
        setExpr('blank', 3);
      } else {
        speak(LINES.sign[(save.sign - 1) % LINES.sign.length], 3.2); setExpr('think', 3.2);
      }
      break;
    case 'chest':
      if (!save.chest) {
        save.chest = true; st.dChest = true; persist(); unlock('chest');
        setExpr('oh', 1.3);                                   // あけた瞬間は期待している
        if (qIs('leaf')) {
          noticeQuirk(); speak('……葉っぱが、1枚。', 3.2);
          setTimeout(() => setExpr('wide', 2.4), 1300);
        } else {
          speak('……からっぽ。', 3.2);
          setTimeout(() => setExpr('blank', 2.4), 1300);      // 中身を見たあと
        }
      } else if (qIs('leaf')) {
        noticeQuirk();
        speak(pick(['きょうは、葉っぱが1枚。', 'だれかが入れたのか。', '葉っぱ。それだけ。']), 2.8);
        setExpr('wide', 2.8);
      } else {
        speak(pick(['やっぱり、からっぽ。', 'ていねいに閉じた。', 'ここは、そういう宝箱。']), 2.8);
        setExpr('blank', 2.8);
      }
      break;
    case 'hole':
      speak(pick(LINES.hole), 2.8); setExpr('wide', 2.8);
      break;
    case 'cat':
      if (!cat.awake) {
        cat.awake = true; cat.vx = 30;
        speak('……起きた。', 2.6); setExpr('oh', 1.6);
        setTimeout(() => speak('ついていくか。', 2.4), 2600);
      } else {
        speak(pick(['もふ。', '猫だ。', 'ごろごろ言っている。']), 2.4);
        setExpr('content', 2.6);
      }
      break;
    case 'cat2':
      noticeQuirk();
      speak(pick(['……2匹いる。', 'きょうは、もう1匹いる。', 'どこから来たのか。', 'よく寝ている。']), 2.8);
      setExpr('wide', 2.8);
      break;
    case 'bird':
      if (qIs('bird')) {
        noticeQuirk();
        speak(pick(['……寝ている。', 'きょうは、静かだ。', 'そっとしておこう。']), 2.8);
        setExpr('content', 2.8);
        break;
      }
      bird.following = true; bird.talkT = 0.2;
      speak(pick(['どうも。', 'こんにちは。', '……。']), 2.2);
      setExpr(save.birdTalks > 8 ? 'blank' : 'smile', 2.2);
      break;
  }
}

/* ---------- 日記 ----------
   その日のかぞえから1行だけつくる。読み返すためだけのもの。 */
const DIARY_TAIL = [
  'とくに、何もなかった。', 'それだけ。', 'わるくない日だった。',
  'また、あした。', 'そういう日。', '……。', 'まあ、いいか。'
];
const DIARY_EMPTY = [
  'なにもしなかった。', 'ずっと、そこにいた。', 'ながめていたら、終わった。', '……。'
];
function makeDiary() {
  // できごと（めずらしいほう）と、かぞえ（毎日あるほう）を分けて、3つまで拾う
  const ev = [], cnt = [];
  if (st.dWet) ev.push('川に落ちた');
  if (st.dCat) ev.push('猫についていった');
  if (st.dChest) ev.push('宝箱をあけた');
  if (st.quirkNoticed) {
    const q = QUIRKS.find(q2 => q2.id === save.quirk);
    if (q) ev.push(q.n);
  }
  if (st.dUmb) ev.push('傘をさした');
  else if (st.dRain) ev.push('雨に、ぬれた');
  if (save.wx === 'snow' && st.snowT > 20) ev.push('雪がふっていた');
  if (save.wx === 'fog' && st.fogT > 20) ev.push('霧で、なにも見えなかった');
  if (save.wx === 'wind' && st.windT > 20) ev.push('風が、つよかった');

  if (st.dJump > 0) cnt.push(st.dJump + '回とんだ');
  if (st.dLap > 0) cnt.push(st.dLap + '周した');
  if (st.dBird > 0) cnt.push('鳥の話を' + st.dBird + '回きいた');
  if (st.dRock > 0) cnt.push('石を' + st.dRock + '回おした');
  if (st.dSign > 0) cnt.push('看板を見た');

  const bits = ev.slice(0, 2);
  for (const c of cnt) { if (bits.length >= 3) break; bits.push(c); }
  for (const e of ev.slice(2)) { if (bits.length >= 3) break; bits.push(e); }

  const t = bits.length
    ? bits.join('。') + '。' + pick(DIARY_TAIL)
    : pick(DIARY_EMPTY);
  return { d: save.day, w: wxOf(save.wx).n, t: t };
}

/* ---------- ねる → つぎの日 ---------- */
let sleeping = false;
function goSleep() {
  if (sleeping) return;
  sleeping = true; unlock('home');
  st.fadeDir = 1;
  speak('きょうも、なんとなく終わった。', 3.4);
  // 日記は「その日」のうちに書く
  save.diary.unshift(makeDiary());
  if (save.diary.length > 120) save.diary.length = 120;
  if (save.diary.length >= 10) unlock('diary10');
  setTimeout(() => {
    save.day++; st.dayTime = 0; st.nightFlag = false;
    st.umbrella = false; st.riverHinted = false;
    st.rain = 0; st.drops = []; st.rainNext = 150 + Math.random() * 150;
    cat.awake = false; cat.x = 1720; bird.following = false; bird.x = 2380; bird.sitting = true;
    P.x = HOUSE_X + 40; P.vx = 0; st.catFollow = 0;
    rollNewDay();          // あたらしい天気と、あたらしいどうでもいいこと

    speak(pick(['ちょっとそこまで。', 'きょうも、そとに出る。', 'あさだ。']), 3);

}

/* ---------- 更新 ---------- */
function update(dt) {
  st.time += dt;
  st.dayTime += dt;
  save.totalPlay += dt;
  st.dayP = Math.min(1, st.dayTime / DAY_LEN);
  document.body.classList.toggle('night', st.dayP > 0.93);
  PAL = palette(st.dayP);
  PAL.bubble = st.dayP > 0.93 ? 'rgba(52,58,92,.94)' : 'rgba(255,255,255,.93)';
  PAL.water  = st.dayP > 0.93 ? '#39527a' : '#a9d5ea';
  PAL.hole   = st.dayP > 0.93 ? '#1b2038' : '#4c5570';
  PAL.warm   = 'rgba(255,214,140,.9)';

  if (st.dayP >= 0.82 && !st.nightFlag) {
    st.nightFlag = true; unlock('dayend'); speak('日が暮れた。', 3); setExpr('wide', 2.6);
  }

  // --- 入力 ---
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  if (dir !== 0 && !P.inWater && !P.indoors) {
    P.vx = dir * WALK; P.facing = dir; P.walking = true; st.idle = 0;
  } else {
    P.vx *= Math.pow(0.0015, dt); P.walking = false;
    if (Math.abs(P.vx) < 3) P.vx = 0;
    st.idle += dt;
  }
  if (P.walking) P.phase += dt * 8.5;

  // --- 移動 ---
  P.x += P.vx * dt;
  if (P.x >= WORLD) { P.x -= WORLD; save.laps++; st.dLap++; if (save.laps >= 20) unlock('lap20'); persistSoon(); }
  if (P.x < 0) P.x += WORLD;

  // --- じゅうりょく ---
  if (!P.onGround) {
    P.vy += GRAV * dt; P.y += P.vy * dt;
    if (P.y >= 0) { P.y = 0; P.vy = 0; P.onGround = true; setExpr('smile', 0.5); }
  }

  // --- 川 ---
  const overRiver = Math.abs(wdist(P.x, RIVER_X)) < RIVER_W / 2 - 6;
  if (!save.bridge && overRiver && P.onGround && !P.inWater) {
    P.inWater = true; P.waterT = 0; P.vx = 0;
    unlock('splash'); st.dWet = true;
    speak('ポチャン。', 1.8);
    for (let i = 0; i < 16; i++)
      st.splash.push({ x: 0, y: 0, vx: (Math.random() - .5) * 200, vy: -120 - Math.random() * 180, t: 1 });
    setTimeout(() => speak('やっぱり。', 2.4), 1700);
    setTimeout(() => {
      st.helper = { x: RIVER_X + 230, phase: 0, state: 'come', t: 0 };
    }, 3600);
  }
  if (P.inWater) {
    P.waterT += dt;
    P.y = Math.min(32 * S, P.y + 46 * dt);
  }
  if (!save.bridge && !P.inWater && P.onGround && Math.abs(wdist(P.x, RIVER_X)) < RIVER_W / 2 + 44) {
    if (!st.riverHinted) { st.riverHinted = true; speak('……渡れるかな。', 2.8); }
  }
  // きょうだけ水が多い日は、橋があってもなくても気づく
  if (qIs('river') && !st.quirkNoticed && !P.inWater && P.onGround
      && Math.abs(wdist(P.x, RIVER_X)) < RIVER_W / 2 + 52) {
    noticeQuirk(); speak('きょうは、水が多い。', 2.8); setExpr('think', 2.6);
  }

  // --- たすけてくれる棒人間 ---
  if (st.helper) {
    const H = st.helper;
    H.t += dt;
    if (H.state === 'come') {
      H.x -= 78 * dt; H.phase += dt * 8.5;
      if (H.x <= RIVER_X + RIVER_W / 2 + 26) {
        H.state = 'talk'; H.t = 0;
        speak('橋、ありますよ。', 3);
      }
    } else if (H.state === 'talk') {
      if (H.t > 2.4) {
        save.bridge = true; persist(); unlock('bridge');
        H.state = 'go'; H.t = 0;
        P.inWater = false; P.y = 0; P.vy = 0; P.onGround = true;
        P.x = RIVER_X - RIVER_W / 2 - 30;
        setTimeout(() => { speak('最初から、あった。', 3); setExpr('blank', 3); }, 900);
      }
    } else {
      H.x += 78 * dt; H.phase += dt * 8.5;
      if (H.x > RIVER_X + 320) st.helper = null;
    }
  }

  // --- しぶき ---
  for (let i = st.splash.length - 1; i >= 0; i--) {
    const s2 = st.splash[i];
    s2.vy += 900 * dt; s2.x += s2.vx * dt; s2.y += s2.vy * dt; s2.t -= dt * 1.2;
    if (s2.t <= 0) st.splash.splice(i, 1);
  }

  // --- 猫 ---
  if (cat.awake) {
    cat.x += cat.vx * dt; cat.phase += dt * 7;
    if (cat.x >= WORLD) cat.x -= WORLD;
    const d = Math.abs(wdist(cat.x, P.x));
    if (d < 110) { st.catFollow += dt; if (st.catFollow > 26) { unlock('cat'); st.dCat = true; } }
    else st.catFollow = Math.max(0, st.catFollow - dt * .6);
  }

  // --- 鳥 ---
  // きょうだけ寝ている日は、ついてこないし、しゃべらない
  if (qIs('bird')) { bird.following = false; bird.y *= 0.8; }
  else if (!bird.following && Math.abs(wdist(bird.x, P.x)) < 150) {
    bird.following = true; bird.talkT = Math.min(bird.talkT, 1.5);
  }
  if (bird.following) {
    const d = wdist(P.x, bird.x);
    if (Math.abs(d) > 46) {
      bird.x += Math.sign(d) * 92 * dt;
      bird.hop += dt * 9;
      bird.y = Math.abs(Math.sin(bird.hop)) * 11 * S;
    } else { bird.y *= 0.8; }
    if (bird.x >= WORLD) bird.x -= WORLD; if (bird.x < 0) bird.x += WORLD;
    bird.talkT -= dt;
    if (bird.talkT <= 0) {
      bird.talkT = 5 + Math.random() * 4;
      birdSpeak = { text: pick(LINES.bird), t: 2.6 };
      save.birdTalks++; st.dBird++; persistSoon();
      // 何度も話しかけられると、だんだん無表情になる
      if (st.exprT <= 0) setExpr(save.birdTalks > 8 ? 'blank' : 'wide', 2.2);
      if (save.birdTalks >= 20) unlock('bird');
    }
  }
  if (birdSpeak) { birdSpeak.t -= dt; if (birdSpeak.t <= 0) birdSpeak = null; }

  // --- あなを見つめる ---
  if (!P.walking && P.onGround && Math.abs(wdist(P.x, HOLE_X)) < 70) {
    st.holeStare += dt;
    if (st.holeStare > 180) unlock('hole3');
  } else st.holeStare = 0;

  // --- 昼の月に気づく（立ちどまっていると、ふと見上げる） ---
  if (qIs('moon') && !st.quirkNoticed && st.dayP > .18 && st.dayP < .62 && st.idle > 7) {
    noticeQuirk(); speak('……昼なのに、月。', 3); setExpr('wide', 2.8);
  }

  // --- ゆっくりたまる実績 ---
  if (save.day >= 30) unlock('day30');
  if (save.totalPlay >= 3600) unlock('play1h');

  // --- なにもしない ---
  if (st.idle > 120) unlock('nothing');
  if (st.idle > 1800) unlock('sleep');
  if (st.idle - st.lastIdleLine > 22 && st.idle > 20 && !bubble) {
    st.lastIdleLine = st.idle;
    speak(pick(LINES.idle), 3);
  }
  if (st.idle < 1) st.lastIdleLine = 0;

  // --- 表情とまばたき ---
  if (st.exprT > 0) st.exprT -= dt;
  if (st.blink > 0) st.blink -= dt;
  else {
    st.blinkNext -= dt;
    if (st.blinkNext <= 0) { st.blink = 0.13; st.blinkNext = 2.5 + Math.random() * 5; }
  }

  // --- ジャンプ連打 ---
  st.burstT += dt;
  if (st.burstT > 6) { st.jumpBurst = 0; st.burstT = 0; }

  // --- きぶん ---
  let m = '🙂', note = '';
  if (st.dayP > 0.86) { m = '😴'; note = 'ねむい'; }
  else if (st.jumpBurst >= 12) { m = '🤔'; note = 'なぜ跳ぶのか'; }
  else if (save.jumps >= 1000) { m = '😐'; note = ''; }
  else if (st.idle > 60) { m = '😴'; note = 'うとうと'; }
  else if (st.idle > 20) { m = '😌'; note = 'おちついている'; }
  else if (st.rain > 0 && !st.umbrella) { m = '😐'; note = 'ぬれている'; }
  else if (save.wx === 'fog' && st.fog > .55) { m = '😶'; note = 'なにも見えない'; }
  else if (save.wx === 'snow') { m = '😌'; note = 'しずか'; }
  else if (save.wx === 'wind') { m = '😑'; note = '風がつよい'; }
  else if (save.wx === 'fine') { m = '😊'; note = 'まぶしい'; }
  else if (P.walking) { m = '🙂'; note = ''; }
  if (m !== st.mood || note !== st.moodNote) {
    st.mood = m; st.moodNote = note;
    document.getElementById('mood').innerHTML = 'きょうのきぶん：<span class="em">' + m + '</span>' + (note ? ' <span style="font-size:11px;opacity:.7">' + note + '</span>' : '');
  }

  // --- ふきだし ---
  if (bubble) { bubble.t += dt; if (bubble.t > bubble.life) bubble = null; }

  // --- 雨 ---
  updateRain(dt);
  updateSky(dt);

  // --- カメラ ---
  const target = P.x - SW * (0.5 - P.facing * 0.08);
  let d2 = wdist(target, camX);
  camX += d2 * Math.min(1, dt * 4.5);
  camX = ((camX % WORLD) + WORLD) % WORLD;

  // --- しらべるボタン ---
  const nx = nearest();
  if ((nx && nx.id) !== (curAct && curAct.id) || (nx && nx.label !== actBtn.textContent)) {
    curAct = nx;
    if (nx) { actBtn.textContent = nx.label; actBtn.classList.add('on'); }
    else actBtn.classList.remove('on');
  }

  // --- フェード ---
  if (st.fadeDir) {
    st.fade += st.fadeDir * dt * 1.1;
    if (st.fade >= 1) { st.fade = 1; st.fadeDir = 0; }
    if (st.fade <= 0) { st.fade = 0; st.fadeDir = 0; }
  }

  // --- ステータス ---
  const sub = document.getElementById('sub');
  const txt = save.day + '日目・' + wxOf(save.wx).n + '　' + save.laps + '周　' + save.jumps + '回とんだ';
  if (sub.textContent !== txt) sub.textContent = txt;

  // --- 保存 ---
  if (saveTimer > 0) { saveTimer -= dt; if (saveTimer <= 0) persist(); }

  updateToast(dt);
}

let birdSpeak = null;

/* ---------- 描画 ---------- */
function render() {
  ctx.clearRect(0, 0, SW, SH);
  drawWorld();
  drawFog(.52);          // 世界をうしろに押しやる、濃いほうの霧

  const px = sx(P.x), py = groundY + P.y;

  // 助けてくれる棒人間
  if (st.helper) {
    const hx = sx(st.helper.x);
    drawPerson(hx, groundY, {
      facing: st.helper.state === 'go' ? 1 : -1,
      walking: st.helper.state !== 'talk',
      phase: st.helper.phase, expr: 'smile', scale: 1
    });
  }

  // 足もとのかげ
  if (!P.inWater) {
    const h = -P.y / (JUMPV * JUMPV / (2 * GRAV));
    ctx.save();
    ctx.globalAlpha = 0.18 * (1 - h * 0.6);
    ctx.fillStyle = PAL.ink;
    ctx.beginPath();
    ctx.ellipse(px, groundY + 2, (18 - h * 5) * S, 3.6 * S, 0, 0, 6.3);
    ctx.fill(); ctx.restore();
  }

  // 本人
  const holdUmb = st.rain > 0 && st.umbrella && !P.inWater;
  const bobv = !P.onGround ? -3 : -Math.abs(Math.sin(P.phase * 2)) * 1.8 * (P.walking ? 1 : 0);
  drawPerson(px, py, {
    facing: P.facing, walking: P.walking, phase: P.phase,
    jumping: !P.onGround,
    expr: currentExpr(), blink: st.blink > 0,
    hold: holdUmb ? [P.facing * UMB_HAND[0], UMB_HAND[1]] : null
  });
  if (holdUmb) drawUmbrella(px, py, P.facing, bobv);

  // 水につかっているところ（人の上に半透明の水をかぶせる）
  if (P.inWater) {
    const rx2 = sx(RIVER_X), rw2 = RIVER_W * S;
    ctx.save();
    ctx.globalAlpha = .62; ctx.fillStyle = PAL.water;
    ctx.fillRect(rx2 - rw2 / 2, groundY - 1, rw2, 82 * S);
    ctx.restore();
  }

  // しぶき
  if (st.splash.length) {
    ctx.fillStyle = PAL.water;
    for (const s2 of st.splash) {
      ctx.globalAlpha = Math.max(0, s2.t);
      ctx.beginPath(); ctx.arc(px + s2.x, groundY + s2.y, 3.4 * S, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  drawFog(.30);          // てまえの、うすいほうの霧（本人まで少しかすむ）

  // 鳥のふきだし
  if (birdSpeak) drawBubble(sx(bird.x), groundY - bird.y - 34 * S, birdSpeak.text, Math.min(1, birdSpeak.t * 2));
  // 本人のふきだし
  if (bubble) {
    const a = Math.min(1, bubble.t * 5) * Math.min(1, (bubble.life - bubble.t) * 3);
    const who = st.helper && st.helper.state === 'talk' && bubble.text.indexOf('橋') === 0
      ? sx(st.helper.x) : px;
    drawBubble(who, py - 104 * S, bubble.text, a);
  }

  drawRain();
  drawSnow();
  drawLeaves();

  if (st.fade > 0) {
    ctx.fillStyle = 'rgba(20,24,44,' + st.fade + ')';
    ctx.fillRect(0, 0, SW, SH);
  }
}

/* ---------- ループ ---------- */
let last = performance.now(), seedT = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  seedT += dt;
  if (seedT > 0.11) { seedT = 0; seedFrame = (seedFrame + 137) & 4095; }
  jc = 0;
  if (st.started) update(dt); else { PAL = palette(0.2); PAL.bubble = 'rgba(255,255,255,.93)'; PAL.water = '#a9d5ea'; PAL.hole = '#4c5570'; }
  if (st.started) render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

      const hd = document.createElement('div');
      hd.className = 'hd';
      hd.textContent = e.d + '日目';
      const wx = document.createElement('span');
      wx.className = 'wx'; wx.textContent = '／' + (e.w || 'ふつう');
      hd.appendChild(wx);
      const tx = document.createElement('div');
      tx.className = 'tx'; tx.textContent = e.t;
      d.appendChild(hd); d.appendChild(tx);
      list.appendChild(d);
    }
  }
  document.getElementById('diLead').textContent =
    save.diary.length + '日ぶん' +
    (save.streak > 1 ? '　' + save.streak + '日つづけて外に出ている' : '');
  diPanel.classList.add('on');
});
document.getElementById('diClose').addEventListener('click', () => diPanel.classList.remove('on'));

/* ---------- 連続で外に出た日数（実際の日付でかぞえる） ---------- */
function dateKey(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function touchStreak() {
  const t = dateKey(new Date());
  if (save.lastDate === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  save.streak = (save.lastDate === dateKey(y)) ? (save.streak || 0) + 1 : 1;
  save.lastDate = t;
  persist();
  if (save.streak >= 7) unlock('streak7');
}

/* ---------- タイトル ---------- */
(function titleArt() {
  const tc = document.getElementById('tcv'), tx = tc.getContext('2d');
  let t = 0;
  function frame() {
    if (st.started) return;
    t += 0.016;
    tx.clearRect(0, 0, 300, 300);
    ctx = tx;                       // 共通の描画関数をそのまま流用する
    const keep = PAL;
    PAL = { ink: '#22315c', bubble: 'rgba(255,255,255,.92)' };
    jc = 0;
    drawPerson(150, 252, { facing: 1, walking: true, phase: t * 8.5, expr: 'smile', scale: 2.0 / S });
    PAL = keep;
    ctx = mainCtx;
    requestAnimationFrame(frame);
  }
  frame();
})();

// はじめて起動したとき、または古いセーブを読んだときは、ここで1日ぶん引く
if (!save.wx || !save.quirk) rollNewDay();

document.getElementById('titleFoot').textContent =
  save.day > 1 ? save.day + '日目のつづきから' : 'はじめて外に出る';

document.getElementById('start').addEventListener('click', () => {
  document.getElementById('title').classList.add('off');
  st.started = true;
  last = performance.now();
  P.x = HOUSE_X + 60;
  touchStreak();
  speak(save.day > 1 ? 'きょうも、ちょっとそこまで。' : 'ちょっとそこまで。', 3.4);
  announceWeather(3800);
});

/* 保存（離脱時） */
addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
addEventListener('pagehide', persist);
</script>
</body>
