<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef4f7">
<meta name="description" content="つくったゲームを置いているところです。">
<title>ゲームおきば</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --paper: #eef4f7;
    --card:  rgba(255,255,255,.72);
    --ink:   #22315c;
    --sub:   rgba(34,49,92,.62);
    --line:  rgba(34,49,92,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #2a3157;
      --card:  rgba(64,71,110,.55);
      --ink:   #eef1fb;
      --sub:   rgba(238,241,251,.62);
      --line:  rgba(238,241,251,.26);
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100%;
    background: var(--paper); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.7;
    padding: calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 40px);
  }
  .inner { max-width: 560px; margin: 0 auto; }

  /* ---- あたま ---- */
  header { text-align: center; margin-bottom: 34px; }
  .figure { width: 116px; height: 144px; display: block; margin: 0 auto 10px; }
  .figure svg { width: 100%; height: 100%; overflow: visible; animation: bob 3.4s ease-in-out infinite; }
  .figure .arm-wave { transform-origin: -9px -48px; animation: wave 2.2s ease-in-out infinite; }
  @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes wave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-13deg); } }
  @media (prefers-reduced-motion: reduce) {
    .figure svg, .figure .arm-wave { animation: none; }
  }
  h1 { font-size: 23px; letter-spacing: .06em; font-weight: 700; }
  header p { font-size: 13px; color: var(--sub); margin-top: 6px; }

  /* ---- 一覧 ---- */
  ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 2.5px solid var(--ink);
    border-radius: 22px 25px 21px 24px;
    padding: 17px 19px 15px;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .card:hover  { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .card:active { transform: translateY(1px); box-shadow: none; }
  .card h2 { font-size: 17px; font-weight: 700; letter-spacing: .02em; }
  .card .desc { font-size: 13px; color: var(--sub); margin-top: 5px; }
  .card .meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 12px;
    border-top: 1.5px dashed var(--line); padding-top: 10px;
  }
  .card .tags { font-size: 11.5px; color: var(--sub); letter-spacing: .04em; }
  .card .go { font-size: 14px; font-weight: 700; white-space: nowrap; }

  footer {
    margin-top: 36px; text-align: center;
    font-size: 11.5px; color: var(--sub); line-height: 2;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="inner">

  <header>
    <div class="figure">
      <!-- 棒人間（手描き風） -->
      <svg viewBox="-46 -108 92 116" xmlns="http://www.w3.org/2000/svg"
           fill="none" stroke="currentColor" stroke-width="3.2"
           stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="手をふる棒人間">
        <!-- あし -->
        <path d="M-5,-21 Q-7,-12 -6,-3"/>
        <path d="M5,-21 Q7,-12 7,-3"/>
        <ellipse cx="-9" cy="-1.5" rx="6.5" ry="3.2" transform="rotate(-5 -9 -1.5)"/>
        <ellipse cx="10" cy="-1.5" rx="6.5" ry="3.2" transform="rotate(5 10 -1.5)"/>
        <!-- からだ -->
        <path d="M-10,-53 Q0,-55.5 10,-53 Q12.5,-38 15,-20.5 Q0,-18 -15,-20.5 Q-12.5,-38 -10,-53 Z"
              fill="var(--paper)"/>
        <!-- うで（右はふっている） -->
        <path d="M9,-48 Q15,-38 19,-27"/>
        <ellipse cx="19.5" cy="-24" rx="3.2" ry="5.2" transform="rotate(18 19.5 -24)"/>
        <g class="arm-wave">
          <path d="M-9,-48 Q-21,-59 -28,-70"/>
          <ellipse cx="-30" cy="-73.5" rx="3.2" ry="5.2" transform="rotate(28 -30 -73.5)"/>
        </g>
        <!-- あたま -->
        <path d="M25.4,-74.6
                 C25.2,-62.2 13.4,-52.6 -0.6,-53.2
                 C-14.2,-53.4 -24.6,-62.6 -25.2,-75.4
                 C-25.6,-87.6 -13.4,-97.4 0.4,-97.2
                 C14.2,-97.0 25.6,-87.4 25.4,-74.6 Z"
              fill="var(--paper)"/>
        <!-- かお -->
        <ellipse cx="-8" cy="-80" rx="2.4" ry="2.9" fill="currentColor" stroke="none"/>
        <ellipse cx="8"  cy="-80" rx="2.4" ry="2.9" fill="currentColor" stroke="none"/>
        <path d="M-6,-71.5 Q0,-65.5 6,-71.5" stroke-width="2.6"/>
      </svg>
    </div>
    <h1>ゲームおきば</h1>
    <p>つくったゲームを置いています。<br>スマホのブラウザでそのまま遊べます。</p>
  </header>

  <ul>

    <!-- ▼ ゲームを増やすときは、この <li> ごとコピーして書きかえる ▼ -->
    <li>
      <a class="card" href="./chotto-boken-app/">
        <h2>棒人間の、ちょっとだけ冒険</h2>
        <div class="desc">
          「ちょっとそこまで」のつもりで家を出る、脱力系の散歩ゲーム。
          敵もゲームオーバーもありません。目的は、なんとなく毎日を過ごすことです。
        </div>
        <div class="meta">
          <span class="tags">スマホ向け ／ 実績16種 ／ 2026年8月</span>
          <span class="go">あそぶ →</span>
        </div>
      </a>
    </li>
    <!-- ▲ ここまで ▲ -->

  </ul>

  <footer>
    <a href="https://github.com/yma3mama-tech/games">github.com/yma3mama-tech/games</a>
  </footer>

</div>
</body>
</html>
